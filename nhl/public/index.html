<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#142030"><link rel="icon" href="/icon.svg"><link rel="manifest" href="/manifest.webmanifest"><title>NHL · THE.BOARD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="/_board/refined.css">
<link rel="stylesheet" href="/_board/portfolio.css">
<link rel="stylesheet" href="/_board/support.css">
<link rel="stylesheet" href="/_board/mybooks.css">
</head><body>
<main id="app" class="wrap">
<header class="nh-top">
  <nav class="nh-tabs" aria-label="NHL views"><a href="#board">Board</a><a href="#live">Live</a><a href="#bets">My bets</a></nav>
  <label class="date-label"><span>Slate</span><input id="slate-date" type="date" aria-label="NHL slate date"></label>
</header>
<div id="feed-note" role="status" class="feed-note"></div>
<section id="board-view">
  <!-- Latest goal: the newest official NHL clip on the slate, muted autoplay; the recent goals beside it (app.js hero) -->
  <section class="nh-hero-grid" aria-label="Latest goal">
    <div class="nh-hero" id="nh-hero"></div>
    <aside class="nh-recent" id="nh-recent" aria-label="Recent goals"></aside>
  </section>
  <section class="nh-headline">
    <div><p class="nh-dayline" id="nh-dayline"><span class="league-mark">NHL</span></p><h1 id="nh-title">Hockey board</h1></div>
    <div class="slate-overview" id="slate-overview" aria-label="Slate overview"></div>
  </section>
  <p id="slate-status" class="sr-only" role="status">Connecting to the ice…</p>
  <div class="nh-toolbar">
    <div class="seg" role="group" aria-label="Markets"><button data-market="ml" aria-pressed="true">Moneyline</button><button data-market="s" aria-pressed="false">Puck line</button><button data-market="t" aria-pressed="false">Total</button></div>
    <label class="nh-book"><span>Book</span><select id="nh-phbook" aria-label="Which book the phone board shows beside Best"></select></label>
    <details class="nh-mybooks-d"><summary><span class="mybk-star" aria-hidden="true">★</span> My books <span id="nh-mybooks-n" class="nh-mybooks-n"></span></summary><div id="nh-mybooks" class="nh-mybooks"></div></details>
    <p class="market-note">Full game <span>Includes OT · check shootout rules</span></p>
  </div>
  <div id="game-list" class="nb"><div class="empty">Loading NHL schedule…</div></div>
  <section id="goalie-matrix" class="goalie-matrix" aria-label="Goalie Matrix"></section>
</section>
<section id="bets-view" hidden><div id="portfolio"></div></section><p class="nh-foot">WebSocket API + Additional Coverage · NHL scores and official replays · Automatic updates</p></main>
<dialog id="game-dialog" aria-label="NHL game details"><div class="dialog-bar"><button data-close aria-label="Close game details">×</button></div><div id="game-detail"></div></dialog>
<dialog id="ticket-dialog" aria-label="Log NHL ticket"><div class="dialog-bar"><button data-close aria-label="Close ticket">×</button></div><div id="ticket-detail"></div></dialog>
<div id="nh-toast" role="status" aria-live="polite"></div>
<script src="/_board/portfolio.js"></script>
<script src="/_board/portfolio-view.js"></script>
<script src="/_board/mybooks.js"></script>
<script src="replays.js"></script>
<script src="vas.js"></script><script src="app.js"></script>
<script src="/_board/activity.js"></script>
<script src="/_board/support.js"></script>
</body></html>
